<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренировка без лишнего</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --a:#6A4CE0; --al:#EFECFD; --ad:#45309E; --a2:#C9BFF5;
  --bg:#FFFFFF; --card:#F6F6F8; --line:#ECECF0; --text:#17181C; --sub:#8B8D96; --mid:#3A3B42;
  --warn-bg:#FFF6E5; --warn:#8A5A00; --calm:#E9F6EF; --calm-d:#0A6A4A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.45}
#app{max-width:460px;margin:0 auto;padding:16px 16px 28px;min-height:100vh;display:flex;flex-direction:column;gap:12px}
h1{font-size:26px;font-weight:600;margin:4px 0 0;line-height:1.2}
h2{font-size:21px;font-weight:600;margin:0;line-height:1.25}
.sub{color:var(--sub);font-size:14px}
.small{font-size:12px;color:var(--sub)}
.top{display:flex;align-items:center;gap:8px;min-height:36px}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--mid);cursor:pointer;flex:none}
.steps{margin-left:auto;font-size:12px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:10px;color:var(--mid);cursor:pointer;font-size:15px;user-select:none}
.chip i{font-size:20px;color:var(--sub)}
.chip.on{background:var(--al);border-color:var(--a);color:var(--ad)}
.chip.on i{color:var(--a)}
.chip .ds{display:block;font-size:12px;color:var(--sub);margin-top:1px}
.chip.on .ds{color:var(--ad)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:14px;color:var(--mid);cursor:pointer;user-select:none;display:flex;align-items:center;gap:5px}
.tag.on{background:var(--al);border-color:var(--a);color:var(--ad)}
.tag i{font-size:15px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row3 .chip{justify-content:center;padding:12px 6px}
.btn{border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:600;cursor:pointer;width:100%;font-family:inherit}
.btn.p{background:var(--a);color:#fff}
.btn.p:active{background:var(--ad)}
.btn.s{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.g{background:transparent;color:var(--a)}
.bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:8px}
.big{font-size:30px;font-weight:600;color:var(--a);line-height:1.1}
.bars{display:flex;gap:4px;margin-top:10px}
.bars span{flex:1;height:6px;border-radius:3px;background:#E6E6EA}
.bars span.on{background:var(--a)}
.days{display:flex;gap:4px;margin-top:4px}
.days span{flex:1;text-align:center;font-size:10px;color:var(--sub)}
.today{background:var(--al);border:1px solid var(--a2);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;color:var(--ad)}
.today i{font-size:22px;color:var(--a)}
.ex{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.ex .num{width:26px;height:26px;border-radius:50%;background:var(--al);color:var(--ad);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.ex .nm{flex:1}
.ex .nm small{display:block;font-size:12px;color:var(--sub)}
.how{border:none;background:none;color:var(--a);font-size:13px;font-weight:600;cursor:pointer;padding:4px;font-family:inherit;display:flex;align-items:center;gap:3px}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden;flex:1}
.prog div{height:100%;background:var(--a);width:0;transition:width .3s}
.wo{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;flex:1}
.phase{font-size:13px;font-weight:600;padding:5px 12px;border-radius:20px;background:var(--al);color:var(--ad)}
.phase.rest{background:var(--calm);color:var(--calm-d)}
.phase.ready{background:var(--warn-bg);color:var(--warn)}
.ring{position:relative;width:220px;height:220px;margin:8px 0}
.ring svg{transform:rotate(-90deg)}
.ring .tm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:600;font-variant-numeric:tabular-nums}
.ctrls{display:flex;gap:18px;align-items:center;justify-content:center;margin-top:auto;padding-top:8px;width:100%}
.cb{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:24px;color:var(--mid);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.cb.main{width:74px;height:74px;background:var(--a);border:none;color:#fff;font-size:30px}
.startbtn{flex:1;max-width:260px;height:64px;border-radius:32px;background:var(--a);color:#fff;border:none;font-size:19px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.reps{font-size:44px;font-weight:600;color:var(--a);line-height:1}
.reps small{font-size:15px;color:var(--sub);font-weight:400}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 10px;width:100%;max-width:300px}
.stepper button{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:22px;color:var(--mid);cursor:pointer;font-family:inherit}
.stepper b{font-size:26px}
.hint{font-size:13px;color:var(--sub);max-width:320px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:24px;font-weight:600;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meal{background:var(--al);border-radius:16px;padding:14px;color:var(--ad);display:flex;flex-direction:column;gap:3px}
.meal .nm{font-size:17px;font-weight:600}
.fact{border:1px dashed var(--a2);border-radius:14px;padding:12px;display:flex;gap:10px;color:var(--mid);font-size:14px}
.fact i{font-size:20px;color:var(--a);flex:none}
.warn{background:var(--warn-bg);border-radius:14px;padding:12px;color:var(--warn);font-size:14px;display:flex;gap:10px}
.warn i{font-size:20px;flex:none}
/* календарь */
.calhead{display:flex;align-items:center;gap:8px}
.calhead .m{flex:1;text-align:center;font-weight:600;font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:11px;color:var(--sub);padding:2px 0}
.cal .d{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;cursor:pointer;background:var(--card);border:1.5px solid transparent;position:relative;color:var(--mid)}
.cal .d.empty{background:none;cursor:default}
.cal .d.done{background:var(--a);color:#fff}
.cal .d.plan{border-color:var(--a);color:var(--ad);background:#fff}
.cal .d.now{font-weight:700}
.cal .d.now::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:currentColor}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend em{width:12px;height:12px;border-radius:4px;display:inline-block}
/* шторка снизу */
.sheet{position:fixed;inset:0;background:rgba(20,20,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet.hidden{display:none}
.panel{background:#fff;width:100%;max-width:460px;border-radius:22px 22px 0 0;padding:18px 16px 24px;max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.panel .grab{width:40px;height:4px;border-radius:2px;background:#DDDDE3;margin:-6px auto 2px}
.panel ol,.panel ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.lbl{font-size:13px;font-weight:600;color:var(--sub);margin-top:4px}
.bad li::marker{color:#D0453A}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:max-content;max-width:90vw;text-align:center;background:#17181C;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet hidden" onclick="if(event.target===this)closeSheet()"><div class="panel" id="panel"></div></div>
<div id="toast" class="toast"></div>

<script>
// ===== Настройки =====
const APP_LINK = "https://t.me/polza_apps_bot";
// Твой ник в Телеграме без @ — для кнопки «Написать автору»
const AUTHOR_USERNAME = "whyfishan";
const EXTRA_MIN = 10;
// Сервер: проверка подписки и статистика
const API = "https://polza.polza-apps.workers.dev";
const CHANNEL_URL = "https://t.me/polza_apps";

// ===== Телеграм =====
const tg = (window.Telegram && Telegram.WebApp) ? Telegram.WebApp : null;
const inTg = !!(tg && tg.initData);
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#FFFFFF'); tg.setBackgroundColor && tg.setBackgroundColor('#FFFFFF'); } catch(e){} }
function haptic(t){ try{ inTg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t||'light'); }catch(e){} }

// ===== Справочники =====
const GROUPS = {
  legs:{name:'Ноги и ягодицы', icon:'ti-walk', done:'Ноги прокачаны', share:'ноги и ягодицы'},
  arms:{name:'Руки, грудь и плечи', icon:'ti-hand-grab', done:'Верх тела прокачан', share:'руки, грудь и плечи'},
  core:{name:'Пресс и спина', icon:'ti-body-scan', done:'Пресс и спина прокачаны', share:'пресс и спину'},
  full:{name:'Всё тело', icon:'ti-run', done:'Всё тело прокачано', share:'всё тело'},
  yoga:{name:'Йога и растяжка', icon:'ti-yoga', done:'Практика завершена', share:'йогу', desc:'Спокойные позы, дыхание, гибкость'}
};
const PLACES = {home:{name:'Дома',icon:'ti-home'}, gym:{name:'В зале',icon:'ti-barbell'}, street:{name:'На улице',icon:'ti-trees'}};
const LEVELS = {
  beg:{name:'Новичок', desc:'до 3 месяцев или после долгого перерыва'},
  mid:{name:'Средний', desc:'от 3 месяцев до года'},
  adv:{name:'Опытный', desc:'больше года регулярно'}
};
// Инвентарь
const EQUIP = {
  mat:{name:'Коврик',icon:'ti-layout-rows'},
  chair:{name:'Стул или диван',icon:'ti-armchair'},
  dumbbells:{name:'Гантели',icon:'ti-barbell'},
  kettlebell:{name:'Гиря',icon:'ti-kettlebell'},
  band:{name:'Резинка',icon:'ti-infinity'},
  bar:{name:'Турник',icon:'ti-grip-horizontal',home:'Турник в проёме'},
  rope:{name:'Скакалка',icon:'ti-jump-rope'},
  barbell:{name:'Штанга',icon:'ti-barbell'},
  bench:{name:'Скамья',icon:'ti-minus',street:'Лавка'},
  legpress:{name:'Жим ногами'},
  latpull:{name:'Верхний блок'},
  cablerow:{name:'Нижний блок'},
  crossover:{name:'Кроссовер'},
  smith:{name:'Смит'},
  hyper:{name:'Гиперэкстензия'},
  dips:{name:'Брусья'},
  treadmill:{name:'Дорожка'},
  bike:{name:'Велотренажёр'},
  elliptical:{name:'Эллипс'}
};
const PLACE_EQ = {
  home:[{g:'Основное',items:['mat','chair']},{g:'Веса',items:['dumbbells','kettlebell']},{g:'Другое',items:['band','bar','rope']}],
  gym:[{g:'Свободные веса',items:['barbell','dumbbells','kettlebell','bench']},{g:'Тренажёры',items:['legpress','latpull','cablerow','crossover','smith','hyper']},{g:'Турник и брусья',items:['bar','dips']},{g:'Кардио',items:['treadmill','bike','elliptical']}],
  street:[{g:'На площадке',items:['bar','dips','bench']},{g:'С собой',items:['rope','band']}]
};
const DEFAULT_EQ = {
  home:['mat'],
  gym:PLACE_EQ.gym.flatMap(x=>x.items),
  street:['bar','dips','bench']
};
const eqName = (id, place) => (EQUIP[id][place] || EQUIP[id].name);

// Вес: шаг, подпись и стартовый вес по уровню (новичок/средний/опытный)
const WTYPES = {
  db:{step:1, unit:'кг на руку', def:{beg:4,mid:8,adv:12}},
  one:{step:2, unit:'кг', def:{beg:6,mid:10,adv:16}},
  bb:{step:2.5, unit:'кг вместе с грифом', def:{beg:20,mid:30,adv:50}},
  kb:{step:4, unit:'кг', def:{beg:8,mid:12,adv:16}},
  mc:{step:5, unit:'кг', def:{beg:20,mid:35,adv:50}}
};

/* Упражнения:
   g — группа, n — название, eq — что нужно (null = ничего; список = любой из вариантов; "a+b" = нужно оба),
   c — базовое (тяжёлое) упражнение, w — тип веса, hold — держать по времени,
   floor — лёжа на полу (не на улице), cardio — кардио для разминки в зале,
   y — йога, sides — поза на две стороны, s — как делать, m — частые ошибки */
const EXERCISES = [
  // ===== Ноги =====
  {id:'squat',g:'legs',eq:null,n:'Приседания',
   s:['Встань, ноги на ширине плеч, носки чуть врозь.','Опускайся, отводя таз назад, будто садишься на стул.','Дойди до параллели бёдер с полом и поднимись.'],
   m:['Колени заваливаются внутрь.','Пятки отрываются от пола.','Спина округляется.']},
  {id:'lunge',g:'legs',eq:null,n:'Выпады назад',
   s:['Встань прямо, руки на поясе.','Шагни одной ногой назад и опустись, пока оба колена не согнутся под прямым углом.','Оттолкнись и вернись. Чередуй ноги.'],
   m:['Переднее колено уходит внутрь.','Корпус сильно наклоняется вперёд.','Слишком короткий шаг.']},
  {id:'bridge',g:'legs',eq:null,floor:true,n:'Ягодичный мостик',
   s:['Ляг на спину, стопы на полу ближе к тазу.','Подними таз, сжимая ягодицы, до прямой линии от плеч до колен.','Задержись на секунду и плавно опустись.'],
   m:['Прогиб в пояснице вместо работы ягодиц.','Стопы стоят слишком далеко.','Резко «падаешь» вниз.']},
  {id:'wallsit',g:'legs',eq:null,hold:true,n:'Стульчик у стены',
   s:['Прижмись спиной к стене.','Опустись, пока бёдра не станут параллельны полу.','Держи положение до конца времени.'],
   m:['Колени выходят за носки.','Упираешься руками в бёдра.','Задерживаешь дыхание.']},
  {id:'calf',g:'legs',eq:null,n:'Подъёмы на носки',
   s:['Встань прямо, можно держаться за опору.','Поднимись на носки как можно выше.','Медленно опустись на пятки.'],
   m:['Слишком быстрый темп.','Неполная амплитуда.','Сгибаешь колени.']},
  {id:'jumpsquat',g:'legs',eq:null,n:'Приседания с выпрыгиванием',
   s:['Присядь до параллели, руки перед собой.','Мощно выпрыгни вверх.','Мягко приземлись на носки и сразу уходи в присед.'],
   m:['Жёсткое приземление на прямые ноги.','Колени сводятся внутрь.','Неглубокий присед.']},
  {id:'sidelunge',g:'legs',eq:null,n:'Боковые выпады',
   s:['Ноги широко, носки вперёд.','Перенеси вес на одну ногу и согни её, вторая остаётся прямой.','Вернись в центр и смени сторону.'],
   m:['Колено уходит за носок.','Отрываешь пятку.','Круглая спина.']},
  {id:'sumo',g:'legs',eq:null,n:'Сумо-приседания',
   s:['Ноги шире плеч, носки развёрнуты наружу.','Присядь, разводя колени в стороны по линии носков.','Поднимись, сжимая ягодицы.'],
   m:['Колени смотрят внутрь.','Наклоняешь корпус вперёд.','Неполная амплитуда.']},
  {id:'stepup',g:'legs',eq:['chair','bench'],n:'Зашагивания на опору',
   s:['Встань перед устойчивой опорой.','Поставь на неё всю стопу и поднимись, толкаясь этой ногой.','Опустись и смени ногу.'],
   m:['Толкаешься нижней ногой.','Ставишь на опору только носок.','Опора шатается — выбери устойчивую.']},
  {id:'bulgarian',g:'legs',eq:['chair','bench'],n:'Болгарские выпады',
   s:['Встань спиной к опоре, носок одной ноги положи на неё.','Опускайся на опорной ноге, пока бедро не станет параллельно полу.','Поднимись. На середине смени ногу.'],
   m:['Колено уходит внутрь.','Стоишь слишком близко к опоре.','Сильно наклоняешь корпус.']},
  {id:'goblet',g:'legs',eq:['dumbbells','kettlebell'],w:'one',n:'Приседания с весом у груди',
   s:['Держи гантель или гирю у груди двумя руками.','Присядь, отводя таз назад, локти между коленей.','Поднимись, толкаясь всей стопой.'],
   m:['Вес уходит от груди.','Корпус заваливается вперёд.','Колени сводятся внутрь.']},
  {id:'rdl',g:'legs',eq:['dumbbells'],w:'db',n:'Румынская тяга с гантелями',
   s:['Встань прямо, гантели перед бёдрами.','Отводи таз назад, скользя гантелями по ногам. Колени чуть согнуты.','Почувствуй натяжение сзади бедра и вернись.'],
   m:['Круглая спина.','Приседаешь вместо наклона.','Гантели далеко от ног.']},
  {id:'bandsquat',g:'legs',eq:['band'],n:'Приседания с резинкой',
   s:['Надень резинку чуть выше колен.','Приседай, разводя колени в стороны против резинки.','Поднимись, не давая коленям сойтись.'],
   m:['Колени тянутся внутрь за резинкой.','Неполный присед.','Пятки отрываются.']},
  {id:'bbsquat',g:'legs',eq:['barbell'],c:true,w:'bb',n:'Приседания со штангой',
   s:['Положи штангу на верх спины, не на шею. Ноги на ширине плеч.','Вдохни, напряги пресс и садись, отводя таз назад.','Опустись до параллели и встань, толкаясь всей стопой. Тяжёлые подходы — со страховкой или в раме.'],
   m:['Колени сводятся внутрь.','Спина округляется внизу.','Штанга лежит на шее.']},
  {id:'bbrdl',g:'legs',eq:['barbell'],c:true,w:'bb',n:'Румынская тяга со штангой',
   s:['Возьми штангу хватом чуть шире бёдер.','Отводи таз назад, штанга скользит по ногам, колени чуть согнуты.','Почувствуй натяжение сзади бедра и выпрямись.'],
   m:['Круглая спина.','Штанга уходит от ног.','Сгибаешь колени, как в приседе.']},

// ===== Хранилище (без аккаунтов) =====
const KEY = 'fitapp_v1';
let DB = {history:[], plan:{}, prefs:{}, weights:{}};
function useCloud(){ try{ return inTg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'); }catch(e){ return false; } }
function mergeDB(a,b){
  const seen = new Set(), hist = [];
  [...(a.history||[]), ...(b.history||[])].forEach(h=>{ const k=h.d+h.g+h.m+h.t; if(!seen.has(k)){ seen.add(k); hist.push(h); } });
  hist.sort((x,y)=> (x.d+x.t) < (y.d+y.t) ? -1 : 1);
  return {history:hist, plan:Object.assign({}, a.plan||{}, b.plan||{}), prefs:Object.assign({}, a.prefs||{}, b.prefs||{}), weights:Object.assign({}, a.weights||{}, b.weights||{})};
}
function loadDB(cb){
  try{ const l = JSON.parse(localStorage.getItem(KEY)); if(l) DB = mergeDB(DB,l); }catch(e){}
  if(useCloud()){
    try{
      tg.CloudStorage.getItem(KEY,(err,val)=>{
        if(!err && val){ try{ DB = mergeDB(DB, JSON.parse(val)); }catch(e){} }
        cb();
      });
      return;
    }catch(e){}
  }
  cb();
}
function saveDB(){
  const monthAgo = ymd(addDays(new Date(),-31));
  Object.keys(DB.plan).forEach(d=>{ if(d < monthAgo) delete DB.plan[d]; });
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
  if(useCloud()){
    // облако Телеграма вмещает ~4000 символов — храним последние записи
    const copy = {history:DB.history.slice(), plan:DB.plan, prefs:DB.prefs, weights:DB.weights};
    let s = JSON.stringify(copy);
    while(s.length > 3900 && copy.history.length){ copy.history.shift(); s = JSON.stringify(copy); }
    try{ tg.CloudStorage.setItem(KEY, s); }catch(e){}
  }
}

// ===== Даты и мелочи =====
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const WD_FULL = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
function nice(s){ const d = parseYmd(s); return WD_FULL[d.getDay()]+', '+d.getDate()+' '+MONTHS_GEN[d.getMonth()]; }
function plural(n,a,b,c){ const m10=n%10, m100=n%100; if(m10===1&&m100!==11) return a; if(m10>=2&&m10<=4&&(m100<10||m100>=20)) return b; return c; }
function fmtMin(m){ if(m<60) return m+' мин'; const h = m/60; return h===1 ? '1 час' : String(h).replace('.',',')+' часа'; }
const fmtSec = s => Math.floor(s/60)+':'+pad(s%60);
const doneOn = d => DB.history.filter(h=>h.d===d);
function streak(){
  let d = new Date(); if(!doneOn(ymd(d)).length) d = addDays(d,-1);
  let n = 0; while(doneOn(ymd(d)).length){ n++; d = addDays(d,-1); }
  return n;
}
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  try{

    return j.ok ? j.subscribed : true;   // непонятный ответ — пускаем
  }catch(e){ return true; }              // сервер недоступен — пускаем
  finally{ clearTimeout(t); }
}

  const b = document.getElementById('recheck'); if(b){ b.disabled = true; b.textContent = 'Проверяем…'; }

// ===== Сборка тренировки =====
function hasEq(e){
  if(!e.eq) return true;
  return e.eq.some(alt => alt.split('+').every(id => S.equip.has(id)));
}
function inGroup(e){ return S.group==='full' || e.g===S.group || e.g2===S.group; }
function fitsPlace(e){ return !(S.place==='street' && e.floor); }
function intervalTimes(){ return ({beg:[30,30], mid:[40,20], adv:[45,15]})[S.level]; }
function gymScheme(e){
  const L = S.level, c = !!e.c;
  const sets = L==='beg' ? 3 : 4;
  let reps = L==='beg' ? '10–12' : L==='mid' ? (c?'8–10':'10–12') : (c?'6–8':'8–12');
  if(e.hold) reps = L==='beg' ? '20–30 сек' : L==='mid' ? '30–45 сек' : '45–60 сек';
  const rest = L==='beg' ? (c?90:60) : L==='mid' ? (c?120:75) : (c?150:90);
  return {sets, reps, rest};
}
function buildPlan(){
  savePrefs();
  const minutes = S.extra ? EXTRA_MIN : S.minutes;
  if(isYoga()) return buildYoga(minutes);
  if(S.place==='gym') return buildGym(minutes);
  return buildInterval(minutes);
}
function buildInterval(minutes){
  S.mode = 'interval';
  const ok = e => !e.y && !e.cardio && hasEq(e) && fitsPlace(e) && inGroup(e);
  let pool = EXERCISES.filter(ok);
  // если упражнений мало — добавляем универсальные на всё тело
  if(pool.length < 5) pool = [...pool, ...EXERCISES.filter(e=>!e.y && !e.cardio && e.g==='full' && !e.eq && !pool.includes(e))];
  const withEq = shuffle(pool.filter(e=>e.eq)), noEq = shuffle(pool.filter(e=>!e.eq));
  if(S.group==='full'){ const f = noEq.filter(e=>e.g==='full').slice(0,2); pool = [...f, ...withEq, ...noEq.filter(e=>!f.includes(e))]; }
  else pool = [...withEq.slice(0,3), ...noEq, ...withEq.slice(3)];
  const count = Math.min(S.extra ? 5 : (minutes>=90 ? 12 : minutes>=60 ? 10 : minutes>=30 ? 8 : 6), pool.length);
  S.plan = shuffle(pool.slice(0,count));
  const [work, rest] = intervalTimes();
  const n = Math.max(1, Math.round(minutes*60/(work+rest)));
  S.items = []; for(let i=0;i<n;i++) S.items.push({kind:'timed', ex:S.plan[i % S.plan.length], sec:work, rest:i<n-1?rest:0});
}
function buildYoga(minutes){
  S.mode = 'yoga';
  const hold = ({beg:30, mid:45, adv:60})[S.level], trans = 10;
  const sav = minutes>=45 ? 300 : minutes>=30 ? 180 : 120;
  const start = [EX.mountain, EX.catcow], end = [EX.child];
  const middle = shuffle(EXERCISES.filter(e=>e.y && !['mountain','catcow','child','savasana'].includes(e.id)));
  const n = Math.max(start.length+end.length+2, Math.floor((minutes*60 - sav) / (hold+trans)));
  const mid = []; for(let i=0; i < n - start.length - end.length; i++) mid.push(middle[i % middle.length]);
  const seq = [...start, ...mid, ...end];
  S.items = seq.map(e=>({kind:'timed', ex:e, sec:hold, rest:trans}));
  S.items.push({kind:'timed', ex:EX.savasana, sec:sav, rest:0});
  S.plan = [...new Set(S.items.map(i=>i.ex))];
}
function buildGym(minutes){
  S.mode = 'gym';
  const ok = e => !e.y && !e.cardio && hasEq(e) && inGroup(e);
  const pool = EXERCISES.filter(ok);
  // сначала базовые упражнения с весом, потом остальные с весом, потом со своим весом
  const rank = e => (e.c && e.w ? 0 : e.w ? 1 : e.c ? 2 : 3);
  let ordered;
  if(S.group==='full'){
    const by = g => shuffle(pool.filter(e=>e.g===g)).sort((a,b)=>rank(a)-rank(b));
    const lists = ['legs','arms','core','full'].map(by); ordered = [];
    for(let i=0; lists.some(l=>l[i]); i++) lists.forEach(l=>{ if(l[i]) ordered.push(l[i]); });
  } else {
    ordered = shuffle(pool).sort((a,b)=>rank(a)-rank(b));
  }
  const cardio = EXERCISES.filter(e=>e.cardio && hasEq(e));
  const warm = !S.extra && minutes>=30 && cardio.length ? 5 : 0;
  const per = S.level==='beg' ? 6 : S.level==='mid' ? 9 : 10;
  const count = S.extra ? 2 : Math.max(2, Math.min(9, Math.round((minutes - warm)/per)));
  S.plan = ordered.slice(0, Math.min(count, ordered.length));
  S.items = [];
  if(warm) S.items.push({kind:'timed', ex:pick(cardio), sec:warm*60, rest:0, warm:true});
  S.plan.forEach((e, ei)=>{
    const sc = gymScheme(e);
    for(let s=1; s<=sc.sets; s++) S.items.push({kind:'set', ex:e, set:s, sets:sc.sets, reps:sc.reps, rest:(ei===S.plan.length-1 && s===sc.sets) ? 0 : sc.rest});
  });
  if(warm) S.plan = [S.items[0].ex, ...S.plan];
}

function viewPreview(){
  const title = (S.extra ? 'Короткий блок: ' : isYoga() ? 'Твоя практика: ' : 'Твоя тренировка: ') + GROUPS[S.group].name.toLowerCase();
  let info, list;
  if(S.mode==='gym'){
    const sets = S.items.filter(i=>i.kind==='set').length;
    info = `${S.plan.length} ${plural(S.plan.length,'упражнение','упражнения','упражнений')} · ${sets} ${plural(sets,'подход','подхода','подходов')} · ~${fmtMin(S.extra?EXTRA_MIN:S.minutes)}<br>Делаешь подход — отмечаешь, отдыхаешь по таймеру`;
    list = S.plan.map((e,i)=>{ const it = S.items.find(x=>x.ex===e); const sub = it.kind==='set' ? `${it.sets} × ${it.reps}` : `${Math.round(it.sec/60)} мин`; return exRow(e,i,sub); }).join('');
  } else if(S.mode==='yoga'){
    const [h] = [S.items[0].sec];
    info = `${S.items.length} ${plural(S.items.length,'поза','позы','поз')} · ~${fmtMin(S.extra?EXTRA_MIN:S.minutes)}<br>Каждую позу держишь ${h} сек, в конце — отдых`;
    list = S.plan.map((e,i)=>exRow(e,i,e.sides?'на обе стороны':'')).join('');
  } else {
    const [w,r] = intervalTimes(), rounds = Math.ceil(S.items.length / S.plan.length);
    info = `${S.plan.length} ${plural(S.plan.length,'упражнение','упражнения','упражнений')} · ${fmtMin(S.extra?EXTRA_MIN:S.minutes)} · ${rounds} ${plural(rounds,'круг','круга','кругов')}<br>${w} сек работаешь, ${r} сек отдыхаешь`;
    list = S.plan.map((e,i)=>exRow(e,i,'')).join('');
  }
  return `${topbar(S.extra ? 'Дополнительно' : '')}
  <h2>${title}</h2>
  <div class="sub">${info}</div>
  ${list}
  <div class="bottom">
    <button class="btn p" onclick="openWorkout()">К тренировке <i class="ti ti-arrow-right" style="vertical-align:-2px"></i></button>
    <button class="btn g" onclick="buildPlan();render()"><i class="ti ti-refresh" style="vertical-align:-2px"></i> Собрать заново</button>
  </div>`;
}
function exRow(e,i,sub){ return `<div class="ex"><span class="num">${i+1}</span><span class="nm">${e.n}${sub?`<small>${sub}</small>`:''}</span><button class="how" onclick="showHow('${e.id}')">Как делать <i class="ti ti-chevron-right"></i></button></div>`; }

function showHow(id, fromWorkout){

    ${e.eq ? `<div class="small">Нужно: ${e.eq.map(a=>a.split('+').map(x=>eqName(x,S.place).toLowerCase()).join(' + ')).join(' или ')}</div>`:''}
    <div class="lbl">Как делать</div>

    <div class="lbl">Частые ошибки</div>

    <div class="small">Если чувствуешь боль (не путай с усталостью мышц) — остановись.</div>
    <button class="btn s" onclick="closeSheet()">Понятно</button>`);

// ===== Звук и экран =====
let W = null, timerId = null, audio = null, wakeLock = null;
function beep(freq, dur, vol){
  try{
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = S.mode==='yoga' ? 'sine' : 'square';
    o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(vol || (S.mode==='yoga' ? 0.18 : 0.12), audio.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
    o.start(); o.stop(audio.currentTime + dur);
  }catch(e){}
}
function chime(){ if(S.mode==='yoga'){ beep(528,1.2); setTimeout(()=>beep(660,1.4),180); } else beep(880,0.3); }
function keepAwake(){ try{ navigator.wakeLock && navigator.wakeLock.request('screen').then(l=>wakeLock=l).catch(()=>{}); }catch(e){} }

// ===== Тренировка =====
// Экран открывается на паузе — таймер стартует только по кнопке «Начать»
function openWorkout(){
  W = {idx:0, started:false, paused:false, phase:'ready', left:0, dur:0, last:Date.now(), startAt:0, activeMs:0, doneIds:new Set(), sets:0, lastSec:null, half:false, switchUntil:0, wt:{}, key:null};
  setItem(0);
  go('workout');
  clearInterval(timerId); timerId = setInterval(tick, 200);
}
function cur(){ return S.items[W.idx]; }
function setItem(i){
  W.idx = i; const it = cur(); W.half = false; W.lastSec = null;
  if(it.kind==='timed'){ W.phase = W.started ? 'work' : 'ready'; W.dur = W.left = it.sec*1000; }
  else { W.phase = W.started ? 'doing' : 'ready'; }
  if(it.ex.w && W.wt[it.ex.id]===undefined) W.wt[it.ex.id] = DB.weights[it.ex.id] ?? WTYPES[it.ex.w].def[S.level];
}
function startNow(){
  beep(1,0.01,0.001); keepAwake();
  W.started = true; W.startAt = Date.now(); W.last = Date.now();
  const it = cur();
  W.phase = it.kind==='timed' ? 'work' : 'doing';
  W.doneIds.add(it.ex.id);
  chime(); haptic('medium'); updateWorkout();
}
function advance(){
  const it = cur();
  if(W.idx >= S.items.length-1){ finishWorkout(); return; }
  if(it.rest){ W.phase='rest'; W.dur=W.left=it.rest*1000; W.lastSec=null; if(S.mode!=='yoga') beep(520,0.3); haptic('light'); updateWorkout(); return; }
  nextItem();
}
function nextItem(){
  setItem(W.idx+1);
  const it = cur(); W.doneIds.add(it.ex.id);
  chime(); haptic('medium'); updateWorkout();
}
function tick(){
  if(!W || S.screen!=='workout') return;
  const now = Date.now(), dt = now - W.last; W.last = now;
  if(!W.started || W.paused || W.phase==='doing') { if(W.started && !W.paused) W.activeMs += dt; return; }
  W.activeMs += dt;
  W.left -= dt;
  const it = cur();
  if(W.phase==='work' && S.mode==='yoga' && it.ex.sides && !W.half && W.left <= W.dur/2){ W.half = true; W.switchUntil = now + 4000; chime(); haptic('light'); }
  const sec = Math.ceil(W.left/1000);
  if(S.mode!=='yoga' && sec<=3 && sec>0 && sec!==W.lastSec){ W.lastSec = sec; beep(660,0.1); }
  if(W.left <= 0){ if(W.phase==='work') advance(); else if(W.phase==='rest') nextItem(); }
  else updateWorkout();
}
function togglePause(){ if(!W.started) return startNow(); W.paused = !W.paused; W.last = Date.now(); updateWorkout(); }
function skip(){
  if(!W.started) return startNow();
  if(W.phase==='rest') return nextItem();
  W.last = Date.now(); advance();
}
function setDone(){
  const it = cur();
  if(it.ex.w){ DB.weights[it.ex.id] = W.wt[it.ex.id]; }
  W.sets++;
  advance();
}
function addRest(sec){ W.left += sec*1000; W.dur += sec*1000; updateWorkout(); }
function changeWeight(dir){
  const it = cur(), t = WTYPES[it.ex.w];
  W.wt[it.ex.id] = Math.max(0, Math.round((W.wt[it.ex.id] + dir*t.step)*10)/10);
  const el = document.getElementById('wW'); if(el) el.textContent = String(W.wt[it.ex.id]).replace('.',',');
}
function askFinish(){
  if(W.started && !W.paused && W.phase!=='doing') togglePause();
  openSheet(`<div class="grab"></div><h2>Закончить тренировку?</h2>
    <div class="sub">${W.started ? 'То, что уже сделал, сохранится.' : 'Ты ещё не начал — ничего не сохранится.'}</div>
    <button class="btn p" onclick="closeSheet();finishWorkout()">Закончить</button>
    <button class="btn s" onclick="closeSheet();if(W.paused)togglePause()">Продолжить</button>`);
}
function finishWorkout(){
  clearInterval(timerId);
  try{ wakeLock && wakeLock.release(); }catch(e){}
  if(!W.started){ W = null; go('home'); return; }
  const now = new Date();
  const exCount = [...W.doneIds].filter(id=>!EX[id].cardio).length;
  const rec = {d:ymd(now), t:pad(now.getHours())+':'+pad(now.getMinutes()), g:S.group, p:S.place, m:Math.max(1, Math.round(W.activeMs/60000)), e:exCount, x:S.extra?1:0};
  if(S.mode==='gym') rec.s = W.sets;
  DB.history.push(rec);
  if(DB.plan[rec.d] === rec.g) delete DB.plan[rec.d];
  saveDB();
  sendEvent(rec);
  S.last = Object.assign({}, rec, {meal:pick(MEALS[rec.g]), fact:pick(FACTS[rec.g])});
  beep(990,0.25); setTimeout(()=>beep(1320,0.4),250); haptic('heavy');
  W = null; go('done');
}

  return `<div class="top">

    <div class="sub" id="wNext"></div>

  </div>`;
}
function ringHtml(color){
  return `<div class="ring"><svg width="220" height="220" viewBox="0 0 220 220"><circle cx="110" cy="110" r="96" fill="none" stroke="#ECECF0" stroke-width="12"/><circle id="wArc" cx="110" cy="110" r="96" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round" stroke-dasharray="603.2" stroke-dashoffset="0"/></svg><div class="tm" id="wTime"></div></div>`;
}
function updateWorkout(){
  if(!W) return;
  const $ = id => document.getElementById(id); if(!$('wBody')) return;
  const it = cur(), nextIt = S.items[W.idx+1];
  const showEx = W.phase==='rest' && nextIt ? nextIt : it;
  const key = [W.idx, W.phase, W.started, W.paused].join('|');
  if(key !== W.key){
    W.key = key;
    // фаза и названия
    const ph = $('wPhase');
    const yoga = S.mode==='yoga';
    const label = !W.started ? 'Готов?' : W.paused ? 'Пауза' : W.phase==='rest' ? (yoga ? 'Переход' : 'Отдых') : W.phase==='doing' ? 'Подход' : yoga ? 'Держи позу' : it.warm ? 'Разминка' : 'Работаем';
    ph.textContent = label;
    ph.className = 'phase ' + (!W.started ? 'ready' : W.phase==='rest' ? 'rest' : '');
    $('wName').textContent = W.phase==='rest' && nextIt ? 'Дальше: ' + nextIt.ex.n : it.ex.n;
    $('wHow').onclick = () => showHow(showEx.ex.id, true);
    const sub = showEx.kind==='set' ? `Упражнение ${S.plan.indexOf(showEx.ex)+1} из ${S.plan.length} · подход ${showEx.set} из ${showEx.sets}` : '';
    $('wSub').textContent = sub;
    // середина
    let body = '';
    if(W.phase==='doing' || (!W.started && it.kind==='set')){
      body += `<div class="reps">${it.reps} <small>${it.reps.includes('сек') ? '' : 'повторов'}</small></div>`;
      if(it.ex.w){
        const t = WTYPES[it.ex.w], prev = DB.weights[it.ex.id];
        body += `<div class="stepper"><button onclick="changeWeight(-1)" aria-label="Меньше">−</button><span><b id="wW">${String(W.wt[it.ex.id]).replace('.',',')}</b> ${t.unit}</span><button onclick="changeWeight(1)" aria-label="Больше">+</button></div>`;
        body += `<div class="hint">${prev!==undefined ? `В прошлый раз: ${String(prev).replace('.',',')} кг. ` : 'Это примерный стартовый вес. '}Подбери вес так, чтобы последние 2 повтора давались тяжело. Не выходит сделать минимум — сбавь.</div>`;
      } else {
        body += `<div class="hint">Делай технично. Не получается столько — сделай сколько сможешь.</div>`;
      }
    } else {
      body += ringHtml(W.phase==='rest' ? '#1D9E75' : it.warm ? '#E0A030' : '#6A4CE0');
    }
    $('wBody').innerHTML = body;
    // кнопки
    let ctrls;
    if(!W.started) ctrls = `<button class="startbtn" onclick="startNow()"><i class="ti ti-player-play"></i> Начать</button>`;
    else if(W.phase==='doing') ctrls = `<div class="cb" onclick="skip()" aria-label="Пропустить подход"><i class="ti ti-player-skip-forward"></i></div><button class="startbtn" onclick="setDone()"><i class="ti ti-check"></i> Подход сделан</button>`;
    else if(W.phase==='rest' && S.mode==='gym') ctrls = `<div class="cb" onclick="addRest(30)" aria-label="Плюс 30 секунд" style="font-size:15px;font-weight:600">+30</div><button class="startbtn" onclick="skip()">Пропустить отдых</button>`;
    else ctrls = `<div class="cb" onclick="askFinish()" aria-label="Закончить"><i class="ti ti-player-stop"></i></div><div class="cb main" onclick="togglePause()" aria-label="Пауза"><i class="ti ${W.paused?'ti-player-play':'ti-player-pause'}"></i></div><div class="cb" onclick="skip()" aria-label="Пропустить"><i class="ti ti-player-skip-forward"></i></div>`;
    $('wCtrls').innerHTML = ctrls;
  }
  // то, что меняется каждую секунду
  if($('wTime')){
    const sec = Math.max(0, Math.ceil((W.started ? W.left : it.sec*1000)/1000));
    $('wTime').textContent = fmtSec(sec);
    $('wArc').setAttribute('stroke-dashoffset', W.started ? (603.2*(1 - W.left/W.dur)).toFixed(1) : '0');
  }
  let nextTxt = '';
  if(S.mode==='yoga' && W.phase==='work' && Date.now() < W.switchUntil) nextTxt = '🔄 Смени сторону';
  else if(S.mode==='yoga' && W.phase==='work' && it.ex.sides && !W.half) nextTxt = 'На середине — сигнал сменить сторону';
  else if(W.phase==='rest' && S.mode==='gym' && nextIt) nextTxt = nextIt.ex===it.ex ? 'Следующий подход того же упражнения' : 'Новое упражнение';
  else if((W.phase==='work' || W.phase==='ready') && it.kind==='timed' && nextIt) nextTxt = 'Потом: ' + nextIt.ex.n;
  else if(!nextIt && W.started && W.phase!=='rest') nextTxt = S.mode==='yoga' ? 'Последняя поза — просто отдыхай' : 'Последнее!';
  $('wNext').textContent = nextTxt;
  $('wCount').textContent = (W.idx+1)+' / '+S.items.length;
  $('wProg').style.width = ((W.idx + (W.phase==='rest'?1:0)) / S.items.length * 100) + '%';
}

// ===== Итог =====
function viewDone(){
  const L = S.last, g = GROUPS[L.g];
  const st = streak(), yoga = L.g==='yoga';
  return `<div style="padding-top:8px">
    <h1>${g.done}</h1>
    <div class="sub" style="margin-top:4px">${yoga ? 'Спасибо себе за это время' : 'Отличная работа'}${userName?', '+esc(userName):''}!</div>
  </div>
  <div class="grid2">
    <div class="stat"><span class="small">Время</span><b>${L.m} <span class="small">мин</span></b></div>
    <div class="stat"><span class="small">${yoga ? 'Поз' : L.s ? 'Подходов' : 'Упражнений'}</span><b>${L.s || L.e}</b></div>
    <div class="stat"><span class="small">Серия</span><b>${st} <span class="small">${plural(st,'день','дня','дней')}</span></b></div>
    <div class="stat"><span class="small">Всего тренировок</span><b>${DB.history.length}</b></div>
  </div>
  <div class="meal">
    <span style="font-size:12px">${yoga ? 'Что съесть после практики' : 'Что съесть в течение 1–2 часов'}</span>
    <span class="nm">${L.meal.n}</span>
    <span style="font-size:12px;color:var(--a)">${L.meal.m}</span>
  </div>
  <div class="fact"><i class="ti ti-bulb"></i><span>${L.fact}</span></div>
  <div class="bottom">
    <button class="btn p" onclick="share()"><i class="ti ti-send" style="vertical-align:-2px"></i> Поделиться</button>
    <button class="btn s" onclick="askExtra()"><i class="ti ti-plus" style="vertical-align:-2px"></i> Добавить ещё</button>
    <button class="btn g" onclick="go('home')">Готово</button>
  </div>`;
}
function askExtra(){
  const L = S.last;
  const today = doneOn(L.d).reduce((s,h)=>s+h.m,0);
  const others = Object.entries(GROUPS).filter(([k])=>k!==L.g);
  openSheet(`<div class="grab"></div>
    <h2>Добавить ещё?</h2>
    <div class="warn"><i class="ti ti-alert-triangle"></i><span>Сегодня ты уже позанимался ${today} мин. Не перетрудись: добавим короткий блок на ${EXTRA_MIN} минут. Если кружится голова, что-то болит или сильно устал — лучше отдохнуть, мышцы растут во время отдыха.</span></div>
    <div class="lbl">Что добавим?</div>
    ${others.map(([k,g])=>`<div class="chip" onclick="startExtra('${k}')"><i class="ti ${g.icon}"></i>${g.name}</div>`).join('')}
    <button class="btn g" onclick="closeSheet()">Нет, на сегодня хватит</button>`);
}
function startExtra(k){ closeSheet(); S.extra = true; S.group = k; buildPlan(); go('preview'); }

function share(){
  const L = S.last;
  const link = APP_LINK || location.href.split('#')[0];
  const verb = L.g==='yoga' ? 'Позанимался йогой' : 'Потренировал ' + GROUPS[L.g].share;
  const text = `${verb}: ${L.m} мин 💪 Серия: ${streak()} ${plural(streak(),'день','дня','дней')}. Попробуй и ты — бесплатно:`;
  if(inTg){ try{ tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(text)); return; }catch(e){} }
  if(navigator.share){ navigator.share({text, url:link}).catch(()=>{}); return; }
  try{ navigator.clipboard.writeText(text+' '+link).then(()=>toast('Текст скопирован — вставь его в чат')); }catch(e){ toast('Не получилось поделиться'); }
}

// ===== Календарь =====
function openCalendar(){ const n = new Date(); S.calMonth = new Date(n.getFullYear(), n.getMonth(), 1); go('calendar'); }
function moveMonth(n){ S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth()+n, 1); render(); }
function viewCalendar(){
  const m = S.calMonth, first = (m.getDay()+6)%7, daysIn = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate();
  const today = ymd(new Date());
  let cells = WD.map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<first;i++) cells += '<div class="d empty"></div>';
  for(let d=1; d<=daysIn; d++){
    const key = m.getFullYear()+'-'+pad(m.getMonth()+1)+'-'+pad(d);
    const cls = doneOn(key).length ? 'done' : DB.plan[key] ? 'plan' : '';
    cells += `<div class="d ${cls} ${key===today?'now':''}" onclick="dayInfo('${key}')">${d}</div>`;
  }
  const upcoming = Object.keys(DB.plan).filter(d=>d>=today && GROUPS[DB.plan[d]]).sort().slice(0,5);
  const monthDone = DB.history.filter(h=>h.d.startsWith(m.getFullYear()+'-'+pad(m.getMonth()+1))).length;
  return `${topbar('')}
  <h2>Календарь</h2>
  <div class="sub">Нажми на день, чтобы запланировать тренировку.</div>
  <div class="calhead">
    <div class="iconbtn" onclick="moveMonth(-1)" aria-label="Предыдущий месяц"><i class="ti ti-chevron-left"></i></div>
    <div class="m">${MONTHS[m.getMonth()][0].toUpperCase()+MONTHS[m.getMonth()].slice(1)} ${m.getFullYear()}</div>
    <div class="iconbtn" onclick="moveMonth(1)" aria-label="Следующий месяц"><i class="ti ti-chevron-right"></i></div>
  </div>
  <div class="cal">${cells}</div>
  <div class="legend">
    <span><em style="background:var(--a)"></em>Тренировался</span>
    <span><em style="border:1.5px solid var(--a)"></em>Запланировано</span>
  </div>
  <div class="small">В этом месяце тренировок: ${monthDone}</div>
  <div class="lbl">Ближайшие планы</div>
  ${upcoming.length ? upcoming.map(d=>`<div class="ex" onclick="dayInfo('${d}')" style="cursor:pointer"><i class="ti ${GROUPS[DB.plan[d]].icon}" style="color:var(--a);font-size:20px"></i><span class="nm">${nice(d)}</span><span class="small">${GROUPS[DB.plan[d]].name}</span></div>`).join('') : '<div class="sub">Пока ничего не запланировано.</div>'}`;
}
function dayInfo(key){
  const today = ymd(new Date()), done = doneOn(key), future = key >= today;
  let html = `<div class="grab"></div><h2>${nice(key)}</h2>`;
  if(done.length){
    html += `<div class="lbl">Сделано</div>` + done.map(h=>`<div class="ex"><i class="ti ti-check" style="color:var(--a);font-size:20px"></i><span class="nm">${(GROUPS[h.g]||{name:'Тренировка'}).name}${h.x?' (доп.)':''}</span><span class="small">${h.m} мин</span></div>`).join('');
  }
  if(future){
    html += `<div class="lbl">Что планируешь?</div>` + Object.entries(GROUPS).map(([k,g])=>`<div class="chip ${DB.plan[key]===k?'on':''}" onclick="setPlan('${key}','${k}')"><i class="ti ${g.icon}"></i>${g.name}</div>`).join('');
    if(DB.plan[key]) html += `<button class="btn g" onclick="setPlan('${key}',null)">Убрать из плана</button>`;
  } else if(!done.length){
    html += `<div class="sub">В этот день тренировки не было.</div>`;
  }
  html += `<button class="btn s" onclick="closeSheet()">Закрыть</button>`;
  openSheet(html);
}
function setPlan(key, g){
  if(g) DB.plan[key] = g; else delete DB.plan[key];
  saveDB(); haptic('light'); closeSheet(); render();
  toast(g ? 'Запланировано: '+GROUPS[g].name.toLowerCase() : 'Убрано из плана');
}

// ===== Шторка и подсказки =====
function openSheet(html){ document.getElementById('panel').innerHTML = html; document.getElementById('sheet').classList.remove('hidden'); }
function closeSheet(){ document.getElementById('sheet').classList.add('hidden'); }
let toastT; function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove('show'), 2200); }

// ===== Запуск =====
try{ inTg && tg.BackButton && tg.BackButton.onClick(()=>{ if(!document.getElementById('sheet').classList.contains('hidden')) closeSheet(); else back(); }); }catch(e){}
loadDB(startApp);
</script>
</body>
</html>
